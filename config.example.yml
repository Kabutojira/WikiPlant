schema_version: 2
instance:
  id: null
  name: null
  language: en
  timezone: UTC
storage:
  provider: google-drive
  root_folder_id: null
  consistency_mode: strict
  # GitHub alternative (opt in only): replace the Drive fields above with
  # repository_id, repository (owner/name), canonical_ref, root_prefix: "",
  # consistency_mode: git-fast-forward, and bounded limits. Initial limits are
  # max_file_bytes: 512000, max_transaction_bytes: 8000000,
  # max_repository_bytes: 500000000 (retained Git objects plus conservative
  # prospective-object allowance), max_paths_per_transaction: 200.
  # Never mix Drive and GitHub fields.
runtime:
  release_id: null
  source_commit: null
  manifest_sha256: null
  upgrades: explicit-user-request
skill:
  per_instance: true
  installed_reference: null
  routing_profile_revision: 1
primary_topic_ids: []
schedules:
  daily:
    local_time: null
  weekly:
    weekday: null
    local_time: null
initialization:
  max_research_attempts: 5
queue:
  normal_daily_attempts: 5
  urgent_daily_attempts_total: 10
  urgent_priority: 0
  max_attempts_per_item: 3
expansion:
  child_priority_increment: 20
  max_children_per_research: 3
  preserve_expansion_priority: true
main_topic_refresh:
  enabled: true
  outside_queue_budget: true
  max_search_queries_per_topic: 4
  max_source_fetches_per_topic: 8
  lookback_overlap_hours: 12
exploration:
  allow_adjacent_topics: true
topic_governance:
  max_active_adjacent_topics: 30
  max_active_peripheral_topics: 15
  peripheral_expiry: next_weekly_maintenance
  archive_summary_target_words: [100, 200]
  archive_recovery_retention_days: 7
queue_admission:
  max_active_automatic_items: 50
  max_new_automatic_roots_per_day: 5
  revalidate_pending_after_days: 14
  automatic_candidate_deferral_days: 30
  max_semantic_comparisons: 20
maintenance:
  max_semantic_pages_per_week: 30
  validation_lane_slot: 5
reports:
  delivery: native-task-result
  upcoming_days: 7
  include_quiet_day_report: true
sources:
  retention: metadata-and-permitted-extracts
  retain_full_text: false
